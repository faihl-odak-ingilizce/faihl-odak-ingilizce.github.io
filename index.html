<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odak İngilizce · English Exam Prep</title>
<link rel="icon" href="">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--muted:#5d6678;--line:#d8deea;--pri:#2457c5;--pri2:#e8efff;--ok:#1f9d55;--okb:#e5f6ec;--half:#c27c00;--halfb:#fff4dc;--bad:#d64545;--badb:#fdeaea;--ws:#0f8a7e;--ws2:#e3f6f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.5}
header{background:var(--pri);color:#fff;padding:14px 16px}
.hd{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hd img{width:60px;height:60px;flex:none;background:#fff;border-radius:50%;padding:2px}
.hd .sch{font-size:.72rem;font-weight:800;letter-spacing:.05em;opacity:.92}
header h1{margin:0;font-size:1.4rem;line-height:1.2}
header p{margin:2px 0 0;opacity:.88;font-size:.88rem}
main{max-width:820px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:12px;border:2px solid var(--pri);background:#fff;color:var(--pri);border-radius:12px;font:inherit;font-weight:800;cursor:pointer}
.tab.on{background:var(--pri);color:#fff}
h2.part{font-size:1.05rem;margin:18px 0 8px}
.grid{display:grid;gap:10px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;gap:10px}
.sc:hover{border-color:var(--pri)}
.sc b{font-size:1.05rem}
.sc small{color:var(--muted);display:block}
.go{background:var(--pri2);color:var(--pri);border-radius:10px;padding:6px 12px;font-weight:800;white-space:nowrap}
.sc.w:hover{border-color:var(--ws)}
.sc.w .go{background:var(--ws2);color:var(--ws)}
.note{color:var(--muted);font-size:.9rem;margin-top:14px}
.back{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--pri);color:var(--pri);font:inherit;font-weight:800;font-size:1.12rem;padding:9px 20px;border-radius:12px;cursor:pointer;margin-bottom:12px}
.back:hover{background:var(--pri2)}
.av{width:100%;max-width:104px;height:auto;display:block;margin:0 auto}
.wpic .av{max-width:84px}
.mat.sm{font-size:1.08rem;padding:8px 12px;margin-bottom:6px}
.scale{font-size:.85rem;color:var(--muted);margin:6px 0 10px}
table.cmp{margin-bottom:6px}
.clsbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clsb{border:2px solid var(--pri);background:#fff;color:var(--pri);border-radius:10px;padding:6px 16px;font:inherit;font-weight:800;cursor:pointer}
.clsb.on{background:var(--pri);color:#fff}
#clsmsg{color:var(--bad);font-weight:700}
.av{max-width:120px}
@media (max-width:560px){table.ws td,table.ws th{padding:4px 3px;font-size:.8rem}.bl{min-width:min(100%,220px)!important}}
.examhead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.examhead h2{margin:0;font-size:1.1rem}
.examhead div{color:var(--muted);font-size:.9rem}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
section h3{margin:0 0 10px;font-size:1rem}
.mat{font-family:'Patrick Hand',cursive;font-size:1.2rem;line-height:1.45;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;background:#fbfcff}
.mat.dash{border-style:dashed}
.mat .ttl{text-align:center;font-weight:bold;margin-bottom:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.cardx{border:1.5px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-family:'Patrick Hand',cursive;font-size:1.15rem;background:#fbfcff}
.cardx b{display:block;font-family:Nunito,sans-serif;font-size:.8rem;letter-spacing:.03em}
.q{margin:10px 0}
.q label{display:block;font-weight:700;margin-bottom:4px}
input[type=text]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input[type=text]:focus{outline:none;border-color:var(--pri)}
input.inl{display:inline-block;width:130px;padding:4px 8px;margin:0 4px}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pic{border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.pic .em{font-size:2.6rem;line-height:1.2;margin:4px 0 8px}
.def{font-family:'Patrick Hand',cursive;font-size:1.15rem;border:1.5px solid var(--line);border-radius:20px;padding:4px 14px;margin-bottom:6px;display:inline-block}
.dl{margin:12px 0;line-height:2.1}
table.info{border-collapse:collapse;margin:8px 0 12px;width:100%;max-width:420px}
table.info td{border:1px solid var(--line);padding:5px 8px}
table.info td:first-child{font-weight:800;width:45%}
.fb{font-size:.88rem;margin-top:4px;padding:4px 8px;border-radius:8px;display:none}
.done .fb{display:block}
.r-ok input{border-color:var(--ok);background:var(--okb)}
.r-half input{border-color:var(--half);background:var(--halfb)}
.r-bad input{border-color:var(--bad);background:var(--badb)}
.fb.ok{color:var(--ok)}.fb.half{color:var(--half)}.fb.bad{color:var(--bad)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--pri);color:#fff;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;margin:6px 0}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.ws{background:var(--ws)}
.btn.wsec{background:#fff;color:var(--ws);border:2px solid var(--ws)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:180px}
.score{background:var(--card);border:2px solid var(--pri);border-radius:14px;padding:16px;text-align:center;margin-bottom:14px}
.score .big{font-size:2.6rem;font-weight:800;color:var(--pri)}
.model{background:var(--pri2);border-radius:10px;padding:8px 12px;margin-top:10px;display:none;font-size:.95rem}
.done .model{display:block}
/* worksheets */
.sheet{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 22px 26px}
.sheet .shead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--ws);padding-bottom:8px;margin-bottom:6px;gap:10px;flex-wrap:wrap}
.sheet .shead h2{margin:0;color:var(--ws);font-size:1.3rem}
.sheet .shead span{font-size:.85rem;color:var(--muted)}
.namel{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;margin:6px 0 4px}
.namel span{flex:1;min-width:150px;border-bottom:1px solid #999;padding-bottom:2px}
.ex{margin:18px 0 0}
.ex h4{margin:0 0 8px;font-size:1rem}
.ex h4 b{background:var(--ws);color:#fff;border-radius:6px;padding:0 7px;margin-right:6px}
.box{border:1.5px dashed var(--ws);border-radius:10px;padding:6px 10px;margin:6px 0 10px;font-weight:700;text-align:center;word-spacing:6px}
.bl{display:inline-block;min-width:90px;border-bottom:1.5px solid #555;text-align:center;margin:0 3px;line-height:1.3}
.ans{color:#c0392b;font-weight:800;visibility:hidden}
.showans .ans{visibility:visible}
ol.ws{margin:0;padding-left:22px}ol.ws li{margin:6px 0}
.wpics{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.wpic{border:1.5px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:.9rem}
.wpic .em{font-size:2.3rem;line-height:1.25}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
.cat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat div{border:1.5px solid var(--line);border-radius:10px;padding:8px;min-height:120px}
.cat b{display:block;text-align:center;margin-bottom:4px}
.lines div{border-bottom:1px solid #aaa;height:30px}
table.ws{border-collapse:collapse;width:100%;font-size:.92rem}
table.ws td,table.ws th{border:1px solid var(--line);padding:5px;text-align:center}
.read{font-family:'Patrick Hand',cursive;font-size:1.15rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:#fbfcff}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
@media (max-width:560px){.two,.cat{grid-template-columns:1fr}}
@media print{
 body{background:#fff;font-size:13px}
 header,footer,.noprint{display:none!important}
 main{max-width:none;padding:0}
 .sheet{border:none;padding:0}
 .ex{break-inside:avoid}
 .wpic .em{font-size:1.9rem}
 .two{grid-template-columns:1fr 1fr}.cat{grid-template-columns:1fr 1fr}
}
</style>
</head>

<script>
// ---------- helpers ----------
function norm(s){return (' '+String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/favorite/g,'favourite').replace(/[^a-z0-9çğıöşü' ]+/g,' ').replace(/\s+/g,' ').trim()+' ');}
function has(ans,p){return norm(ans).includes(' '+norm(p).trim());} // word-start match: thursday ⇒ thursdays
function words(s){return norm(s).trim().split(' ').filter(Boolean).length;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const card=(h,rows)=>`<div class="cardx"><b>${h}</b>${rows}</div>`;

function avatar(o){
 const h=o.h||1,hc=o.c||'#222',sh=o.shirt||'#3b82f6',hy=-121;
 let s=`<svg viewBox="0 0 100 150" class="av" role="img" aria-label="person"><line x1="4" y1="146" x2="96" y2="146" stroke="#c9d1e3" stroke-width="2"/><g transform="translate(50 146) scale(${h})">`;

 s+=`<rect x="${-lw}" y="-62" width="${lw-1}" height="60" rx="3" fill="#34495e"/><rect x="1" y="-62" width="${lw-1}" height="60" rx="3" fill="#34495e"/><ellipse cx="${-lw/2-1}" cy="-2" rx="6" ry="3" fill="#222"/><ellipse cx="${lw/2+1}" cy="-2" rx="6" ry="3" fill="#222"/>`;
 const w={slim:11,medium:14,plump:20,well:19}[o.b||'medium'];
 s+=`<line x1="${-w-1}" y1="-102" x2="${-w-5}" y2="-64" stroke="${SKIN}" stroke-width="6" stroke-linecap="round"/><line x1="${w+1}" y1="-102" x2="${w+5}" y2="-64" stroke="${SKIN}" stroke-width="6" stroke-linecap="round"/>`;
 if(o.b==='plump') s+=`<ellipse cx="0" cy="-82" rx="${w+1}" ry="26" fill="${sh}"/>`;
 else if(o.b==='well') s+=`<path d="M${-w-3},-107 L${w+3},-107 L13,-60 L-13,-60 Z" fill="${sh}"/>`;
 else s+=`<rect x="${-w}" y="-106" width="${2*w}" height="46" rx="6" fill="${sh}"/>`;
 if(o.scarf){
  s+=`<path d="M-17,${hy} A17,17 0 0 1 17,${hy} L20,-101 Q0,-95 -20,-101 Z" fill="${o.scarf}"/>`;
 } else {
  if(o.len==='long'){
   if(o.st==='curly') for(let y=-126;y<=-96;y+=7) s+=`<circle cx="-14" cy="${y}" r="5.5" fill="${hc}"/><circle cx="14" cy="${y}" r="5.5" fill="${hc}"/>`;
   else if(o.st==='wavy') s+=`<path d="M-15,-127 Q-20,-118 -15,-110 Q-10,-102 -16,-94 L16,-94 Q10,-102 15,-110 Q20,-118 15,-127 Z" fill="${hc}"/>`;
   else s+=`<rect x="-15" y="-128" width="30" height="34" rx="4" fill="${hc}"/>`;
  }
  if(o.len!=='bald'){
   s+=`<circle cx="0" cy="${hy-3}" r="13.5" fill="${hc}"/>`;
   if(o.st==='curly') for(let a=-165;a<=-15;a+=25){const r=a*Math.PI/180;s+=`<circle cx="${(14*Math.cos(r)).toFixed(1)}" cy="${(hy-3+14*Math.sin(r)).toFixed(1)}" r="4.6" fill="${hc}"/>`;}
  }
 }
 s+=`<ellipse cx="0" cy="${hy+2}" rx="${o.scarf?10:11.5}" ry="${o.scarf?11:12}" fill="${SKIN}"/>`;
 if(o.side) s+=`<ellipse cx="-11.5" cy="${hy-1}" rx="3" ry="5" fill="${o.side}"/><ellipse cx="11.5" cy="${hy-1}" rx="3" ry="5" fill="${o.side}"/>`;
 s+=`<circle cx="-4" cy="${hy}" r="1.4" fill="#222"/><circle cx="4" cy="${hy}" r="1.4" fill="#222"/><path d="M-4,${hy+6} Q0,${hy+9} 4,${hy+6}" stroke="#7a3b2e" stroke-width="1.4" fill="none"/>`;
 if(o.beard) s+=`<path d="M-11.5,${hy+1} Q-11,${hy+16} 0,${hy+17} Q11,${hy+16} 11.5,${hy+1} Q8,${hy+10} 0,${hy+10} Q-8,${hy+10} -11.5,${hy+1} Z" fill="${hc}"/>`;
 if(o.moust||o.beard) s+=`<path d="M-5.5,${hy+5.5} Q0,${hy+2} 5.5,${hy+5.5} Q0,${hy+6.5} -5.5,${hy+5.5} Z" fill="${o.moust&&o.side?o.side:hc}"/>`;
 if(o.glasses) s+=`<g stroke="#222" stroke-width="1.2" fill="none"><circle cx="-4.6" cy="${hy}" r="3.7"/><circle cx="4.6" cy="${hy}" r="3.7"/><line x1="-0.9" y1="${hy}" x2="0.9" y2="${hy}"/></g>`;
 return s+'</g></svg>';
}

const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function cmpFeats(P){
 const R=(S,c,O)=>new RegExp(`\\b(${S[0].toLowerCase()}|${S[1]})\\b.*\\b(${c})\\b.*\\bthan\\b.*\\b(${O[0].toLowerCase()}|${O[2]}|${O[1]})\\b`);
 const R2=(S,c,O)=>new RegExp(`\\b(${S[0].toLowerCase()}|${S[2]})\\b.*\\bhair\\b.*\\b(${c})\\b.*\\bthan\\b.*\\b(${O[0].toLowerCase()}|${O[2]}|${O[1]})\\b`);
 const F=[], num=(name,arr,hi,lo,hiM,loM,excl)=>{
  const [big,small]=arr[0]>arr[1]?[P.A,P.B]:[P.B,P.A];
  F.push({name,excl,re:[R(big,hi,small),R(small,lo,big)],model:`${big[0]} is ${hiM} than ${small[0]}.`});
 };
 const [L,S]=P.hair[0]==='long'?[P.A,P.B]:[P.B,P.A];
 F.push({name:'hair',re:[R(L,'longer hair',S),R(S,'shorter hair',L),R2(L,'longer',S),R2(S,'shorter',L)],model:`${L[0]} has got longer hair than ${S[0]}.`});
 num('age',P.age,'older','younger','older','younger');
 num('height',P.ht,'taller','shorter','taller','shorter','hair');
 num('weight',P.wt,'heavier|fatter','lighter|thinner|slimmer','heavier','lighter');
 num('helpful',P.help,'more helpful','less helpful','more helpful','less helpful');
 num('funny',P.fun,'funnier|more funny','less funny','funnier','less funny');
 return F;
}

function grade1(it,v){
 const q=it.q,k=it.key;
 if(!v.trim()) return 0;
 if(k==='word'||k==='compar') return q.k.some(x=>norm(v)===norm(x))?1:0;
 if(k==='model'){ if(q.k.some(g=>g.every(p=>has(v,p)))) return 1; return q.h.some(p=>has(v,p))?.5:0;}
 if(k==='about'){ const w=words(v); if(w>=3&&q.re.test(norm(v))) return 1; return w>=2?.5:0;}
 if(k==='freq'){ const ad=has(v,q.adv),ac=has(v,q.act.k),other=ADV.some(a=>a[0]!==q.adv&&has(v,a[0]));
  if(other) return 0; if(ad&&ac) return 1; return ad?.5:0; }
 const ok=q.k.some(p=>Array.isArray(p)?p.every(x=>has(v,x)):has(v,p));
 if(ok) return 1;
 return (q.h||[]).some(p=>has(v,p))?.5:0;
}
function gradeCmp(it,v,used){
 const u=used[it.q.sid]||(used[it.q.sid]=new Set()),n=norm(v);
 const ex=()=>'Example: '+((it.q.feats.find(f=>!u.has(f.name))||it.q.feats[0]).model);
 if(!v.trim()) return {r:0,t:ex()};
 const f=it.q.feats.find(f=>(!f.excl||!has(v,f.excl))&&f.re.some(r=>r.test(n)));
 if(f&&!u.has(f.name)){u.add(f.name);return {r:1,t:''};}
 if(f) return {r:.5,t:'Use a different feature. '+ex()};
 if(/\bthan\b/.test(n)) return {r:.5,t:'Check the table again. '+ex()};
 return {r:0,t:ex()};
}
function check(){
 if(REPORT_URL&&!getCls()&&!(cur&&cur.cls)){const m=document.getElementById('clsmsg');m.textContent='Please choose your class first.';m.scrollIntoView({behavior:'smooth',block:'center'});return;}
 let sc=0;const used={};
 cur.items.forEach(it=>{
  const v=document.getElementById(it.id).value,w=document.getElementById('w'+it.id),f=document.getElementById('f'+it.id);
  let r,ans;
  if(it.key==='compare'){const g=gradeCmp(it,v,used);r=g.r;ans=g.t;}
  else{r=grade1(it,v);ans=it.key==='about'?'Example: '+it.q.a:'Answer: '+it.q.a;}
  it.r=r;sc+=r*it.p;
  w.classList.remove('r-ok','r-half','r-bad');w.classList.add('done',r===1?'r-ok':r?'r-half':'r-bad');
  f.className='fb '+(r===1?'ok':r?'half':'bad');
  f.textContent=r===1?'✓ Correct'+(it.key==='about'?' · '+ans:''):(r?'½ Almost. ':'✗ ')+ans;
 });
 document.querySelectorAll('section').forEach(s=>s.classList.add('done'));
 sc=Math.round(sc);
 const msg=sc>=85?'Excellent! 🌟':sc>=70?'Very good! 👍':sc>=50?'Good. Keep practising! 💪':'Read the texts again and try once more. 📚';
 document.getElementById('res').innerHTML=`<div class="score"><div>Your score</div><div class="big">${sc} / 100</div><div>${msg}</div></div>`;
 report(sc);
 window.scrollTo({top:0,behavior:'smooth'});
}
function report(sc){
 if(!REPORT_URL||cur.sent) return; cur.sent=true;
 const parts={};
 cur.items.forEach(it=>{const L=LBL[it.key]||it.key;parts[L]=parts[L]||[0,0];parts[L][0]+=it.r*it.p;parts[L][1]+=it.p;});
 const body=JSON.stringify({g:grade,c:getCls()||cur.cls,s:cur.s,score:sc,parts:Object.entries(parts).map(([k,v])=>[k,+v[0].toFixed(2),+v[1].toFixed(2)])});
 try{fetch(REPORT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});}catch(e){}
}
